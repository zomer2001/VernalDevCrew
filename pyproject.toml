[project]
name = "vernal"
version = "0.2.0"
description = "Vernal: 基于 LoopForge 底座的多智能体架构评审圆桌、滚动 DAG 编排与契约门禁研发平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
docs = ["pypdf>=4.0", "python-docx>=1.1"]

[project.scripts]
vernal = "autodev.cli:app"
autodev = "autodev.cli:app"
vernal-quality = "autodev.quality.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autodev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
